name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: procto
          POSTGRES_PASSWORD: procto
          POSTGRES_DB: procto
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U procto -d procto"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen
      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://procto:procto@localhost:5434/procto
          REDIS_URL: redis://localhost:6380/0
          SECRET_KEY: ci-secret-key-0123456789abcdef0123456789abcdef
          LIVEKIT_API_KEY: procto-dev-key
          LIVEKIT_API_SECRET: procto-dev-secret
          APP_ENV: development
        run: uv run alembic upgrade head
      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check .
      - name: Type check (mypy)
        working-directory: backend
        run: uv run mypy app
      - name: Tests (pytest)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://procto:procto@localhost:5434/procto
          REDIS_URL: redis://localhost:6380/0
          SECRET_KEY: ci-secret-key-0123456789abcdef0123456789abcdef
          LIVEKIT_API_KEY: procto-dev-key
          LIVEKIT_API_SECRET: procto-dev-secret
          APP_ENV: development
        run: uv run pytest --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint
      - name: Tests (vitest)
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8001
          NEXT_PUBLIC_WS_URL: ws://localhost:8001
        run: npm run build